<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeoConnect - AlgoArena 2025</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #8C4E29;
            --on-primary: #FFFFFF;
            --primary-container: #FFDBCA;
            --on-primary-container: #6F3714;
            --secondary: #765848;
            --tertiary: #636032;
            --background: #FFF8F6;
            --on-background: #221A15;
            --surface: #FFF8F6;
            --surface-container: #FCEAE3;
            --surface-variant: #F4DED4;
            --gradient-1: linear-gradient(135deg, #8C4E29 0%, #B8704A 50%, #D4956C 100%);
            --gradient-2: linear-gradient(135deg, #FFDBCA 0%, #FFE8DC 50%, #FFF5F0 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(140, 78, 41, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--background);
            color: var(--on-background);
            overflow-x: hidden;
        }

        #root {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        /* Animated gradient background for slides */
        .slide {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            position: relative;
            background: linear-gradient(135deg, #FFF8F6 0%, #FFEEE6 25%, #FFE4D9 50%, #FFEEE6 75%, #FFF8F6 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(140, 78, 41, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 96, 50, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        @media print {
            #root {
                overflow-y: visible;
                height: auto;
            }

            .slide {
                height: calc(16 / 9 * 100vw);
                page-break-after: always;
                break-inside: avoid;
                scroll-snap-align: none;
                animation: none;
            }

            @page {
                size: 16in 9in;
                margin: 0;
            }
        }

        /* Typography */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 2.5rem;
            position: relative;
            animation: fadeInUp 0.6s ease-out;
        }

        h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--on-primary-container);
            margin-bottom: 1rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 2rem;
            color: var(--tertiary);
            margin-bottom: 3rem;
            text-align: center;
            font-weight: 500;
        }

        .team-info {
            font-size: 1.3rem;
            color: var(--secondary);
            text-align: center;
        }

        /* Glassmorphism content boxes */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
        }

        .content-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(140, 78, 41, 0.12),
                0 2px 8px rgba(140, 78, 41, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(140, 78, 41, 0.15),
                0 4px 12px rgba(140, 78, 41, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .feature-list {
            list-style: none;
            font-size: 1.2rem;
            line-height: 2;
        }

        .feature-list li {
            margin-bottom: 0.75rem;
            padding-left: 2.5rem;
            position: relative;
            transition: transform 0.2s ease;
        }

        .feature-list li:hover {
            transform: translateX(5px);
        }

        .feature-list li:before {
            content: "✦";
            color: var(--primary);
            font-size: 1.2rem;
            position: absolute;
            left: 0;
        }

        /* Video placeholder */
        .video-placeholder {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border: 3px solid var(--primary);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            color: white;
            font-weight: 600;
            text-align: center;
            padding: 3rem;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(140, 78, 41, 0.5);
            position: relative;
            overflow: hidden;
        }

        .video-placeholder::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(140, 78, 41, 0.1), transparent);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Premium Tables */
        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1rem 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(140, 78, 41, 0.1);
        }

        .table th,
        .table td {
            padding: 1.2rem 1.5rem;
            text-align: left;
        }

        .table th {
            background: var(--gradient-1);
            color: var(--on-primary);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
        }

        .table tr {
            background: white;
            transition: background 0.2s ease;
        }

        .table tr:nth-child(even) {
            background: var(--surface-container);
        }

        .table tr:hover {
            background: var(--primary-container);
        }

        .table td {
            border-bottom: 1px solid var(--surface-variant);
        }

        /* Stats cards with gradient borders */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stats-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid transparent;
            background-image: linear-gradient(white, white), var(--gradient-1);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 8px 32px rgba(140, 78, 41, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 48px rgba(140, 78, 41, 0.15);
        }

        .stat-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
        }

        .stat-label {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-top: 0.75rem;
            font-weight: 500;
        }

        .full-width {
            width: 100%;
            max-width: 1400px;
        }

        /* Badges with gradient */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-1);
            color: var(--on-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0.3rem;
            box-shadow: 0 4px 12px rgba(140, 78, 41, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(140, 78, 41, 0.3);
        }

        .badge-green {
            background: linear-gradient(135deg, #05C167 0%, #00E676 100%);
        }

        .badge-blue {
            background: linear-gradient(135deg, #0066FF 0%, #4D94FF 100%);
        }

        /* Highlight box */
        .highlight-box {
            background: var(--gradient-1);
            color: var(--on-primary);
            padding: 2.5rem 3.5rem;
            border-radius: 20px;
            font-size: 1.6rem;
            font-style: italic;
            text-align: center;
            margin: 2rem 0;
            box-shadow: 0 12px 40px rgba(140, 78, 41, 0.25);
            position: relative;
            overflow: hidden;
        }

        .highlight-box::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 6rem;
            opacity: 0.2;
            font-family: Georgia, serif;
        }

        /* Team member cards */
        .team-grid {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .team-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(140, 78, 41, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 180px;
        }

        .team-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(140, 78, 41, 0.2);
        }

        .team-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 4px 20px rgba(140, 78, 41, 0.2);
            margin-bottom: 1rem;
        }

        .team-name {
            font-weight: 700;
            color: var(--on-primary-container);
            font-size: 1rem;
        }

        /* Architecture boxes */
        .arch-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 3px solid var(--primary);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(140, 78, 41, 0.12);
            transition: transform 0.3s ease;
        }

        .arch-box:hover {
            transform: scale(1.02);
        }

        .arch-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--on-primary-container);
            margin-bottom: 0.5rem;
        }

        .arch-subtitle {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        /* Connector lines */
        .connector {
            width: 4px;
            background: var(--gradient-1);
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid,
            .stats-grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 2rem;
            }

            .slide {
                padding: 2rem;
            }
        }

        @media (max-width: 600px) {

            .stats-grid,
            .stats-grid-4 {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .team-grid {
                gap: 1rem;
            }

            .team-card {
                width: 140px;
            }
        }
    </style>
</head>
