            scroll-behavior: smooth;
        }

            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            position: relative;
        }

        @media print {
            #root {
                overflow-y: visible;
                height: auto;
            }

                height: calc(16 / 9 * 100vw);
                page-break-after: always;
                break-inside: avoid;
                scroll-snap-align: none;
